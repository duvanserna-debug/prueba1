<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de resultados</title>
<style>
  :root { --bg:#f5f6fa; --card:#fff; --ink:#1c2230; --mut:#667; --acc:#2f5bea; --line:#dde1ea; --ok:#1a8a4a; --bad:#c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151c; --card:#1b2029; --ink:#e8ebf2; --mut:#9aa3b5; --acc:#6b8cff; --line:#2c3341; --ok:#4cc38a; --bad:#ff7b6b; } }
  * { box-sizing:border-box } body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--ink) }
  main { max-width:1100px; margin:0 auto; padding:16px } .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin:12px 0; overflow-x:auto }
  input { padding:9px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit }
  button { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:9px 16px; font:inherit; cursor:pointer } button:disabled { opacity:.5 }
  table { border-collapse:collapse; width:100%; font-size:.9rem } th,td { padding:6px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap }
  tr.fila { cursor:pointer } tr.fila:hover { background:var(--bg) } .ok { color:var(--ok); font-weight:600 } .bad { color:var(--bad) } .msg { color:var(--mut) }
  .stats { display:flex; gap:24px; flex-wrap:wrap } .stat b { display:block; font-size:1.5rem }
  .det { display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:4px; padding:8px 0 }
  .det span { border:1px solid var(--line); border-radius:6px; padding:2px 6px; font-size:.8rem }
</style>
</head>
<body>
<main>
  <h1>Panel de resultados</h1>
  <div class="card">
    <input id="clave" type="password" placeholder="Clave de administrador">
    <button id="cargar">Cargar</button>
    <button id="csv" disabled>Descargar CSV</button>
    <span class="msg" id="msg"></span>
  </div>
  <div class="card stats" id="stats" hidden></div>
  <div class="card" id="tabla" hidden></div>
</main>
<script src="questions.js"></script>
<script>
const $ = s => document.querySelector(s);
let filas = [], clave = [];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const aciertos = (r, a) => { let n = 0; for (let i = a.desde - 1; i < a.hasta; i++) if (r.respuestas[i] === clave[i]) n++; return n; };
const total = r => AREAS.reduce((s, a) => s + aciertos(r, a), 0);
const tam = a => a.hasta - a.desde + 1;

$("#cargar").onclick = async () => {
  $("#msg").textContent = "Cargando…";
  try {
    const j = await (await fetch(CONFIG.apiUrl + "?action=results&key=" + encodeURIComponent($("#clave").value))).json();
    if (!j.ok) throw new Error(j.error);
    filas = j.rows; clave = j.clave; pintar(); $("#msg").textContent = filas.length + " registros"; $("#csv").disabled = false;
  } catch (e) { $("#msg").textContent = "Error: " + e.message; }
};

function pintar() {
  const comp = filas.filter(r => r.estado === "completo");
  const prom = (f) => comp.length ? (comp.reduce((s, r) => s + f(r), 0) / comp.length).toFixed(1) : "—";
  $("#stats").hidden = false;
  $("#stats").innerHTML = `<div class="stat"><b>${filas.length}</b>Estudiantes (${comp.length} completos)</div><div class="stat"><b>${prom(total)}</b>Promedio total /100</div>` +
    AREAS.map(a => `<div class="stat"><b>${prom(r => aciertos(r, a))}</b>${a.nombre} /${tam(a)}</div>`).join("");
  $("#tabla").hidden = false;
  $("#tabla").innerHTML = `<table><tr><th>Fecha</th><th>Nombre</th><th>Documento</th><th>Estado</th>${AREAS.map(a => `<th>${a.nombre}</th>`).join("")}<th>Total</th></tr>` +
    filas.map((r, k) => `<tr class="fila" data-k="${k}"><td>${esc(new Date(r.fecha).toLocaleString())}</td><td>${esc(r.nombre)}</td><td>${esc(r.documento)}</td><td>${esc(r.estado)}</td>` +
      AREAS.map(a => `<td>${aciertos(r, a)}/${tam(a)}</td>`).join("") + `<td><b>${total(r)}/100</b></td></tr>`).join("") + "</table>";
  document.querySelectorAll("tr.fila").forEach(tr => tr.onclick = () => detalle(tr));
}

function detalle(tr) {
  const sig = tr.nextElementSibling;
  if (sig && sig.classList.contains("detalle")) { sig.remove(); return; }
  const r = filas[tr.dataset.k];
  const celdas = r.respuestas.map((x, i) => `<span class="${x === clave[i] ? "ok" : "bad"}" title="Tiempo: ${r.tiempos[i]} s">${i + 1}: ${x}${x === clave[i] ? "" : " (" + clave[i] + ")"}</span>`).join("");
  tr.insertAdjacentHTML("afterend", `<tr class="detalle"><td colspan="${5 + AREAS.length}"><div class="det">${celdas}</div><div class="msg">Verde = correcta · Rojo = incorrecta o en blanco (entre paréntesis la clave).</div></td></tr>`);
}

$("#csv").onclick = () => {
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const cab = ["Fecha", "Nombre", "Documento", "Estado", ...AREAS.map(a => a.nombre), "Total", ...clave.map((_, i) => "P" + (i + 1)), ...clave.map((_, i) => "T" + (i + 1) + " (s)")];
  const lineas = filas.map(r => [r.fecha, r.nombre, r.documento, r.estado, ...AREAS.map(a => aciertos(r, a)), total(r), ...r.respuestas, ...r.tiempos].map(q).join(","));
  const blob = new Blob(["﻿" + [cab.map(q).join(","), ...lineas].join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "resultados.csv"; a.click();
};
</script>
</body>
</html>
